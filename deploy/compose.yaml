# Local infrastructure. TLS/ACL sample requires human security review.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "${POSTGRES_PORT_BIND:-127.0.0.1:5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [local]

  # Unsafe for real Gateway connections. Local host-only development opt-in.
  mqtt-dev:
    image: eclipse-mosquitto:2.0
    user: "1883:1883"
    profiles: ["dev-insecure"]
    ports:
      - "0.0.0.0:1883:1883"
    volumes:
      - ./mosquitto/dev.conf:/mosquitto/config/mosquitto.conf:ro
    networks: [dev, local]

  # TLS profile requires locally provisioned certificates (gitignored).
  mqtt-tls:
    build: ./mosquitto
    profiles: ["tls"]
    ports:
      - "127.0.0.1:8883:8883"
    volumes:
      - type: bind
        source: ${MQTT_CERT_DIR:-./secrets/broker}
        target: /mosquitto/certs
        read_only: true
        bind:
          create_host_path: false
      - mqtt_data:/mosquitto/data
    networks: [local]

  backend:
    build:
      context: ../backend-go
      dockerfile: Dockerfile
    profiles: ["fullstack", "backend"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      DATABASE_URL: "${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=${POSTGRES_SSLMODE:-disable}}"
      MQTT_HOST: ${MQTT_HOST:-mqtt-tls}
      MQTT_PORT: ${MQTT_PORT:-8883}
      MQTT_TLS_ENABLED: ${MQTT_TLS_ENABLED:-true}
      MQTT_TLS_CA_FILE: ${MQTT_TLS_CA_FILE:-/run/secrets/mqtt/ca.crt}
      MQTT_TLS_CERT_FILE: ${MQTT_TLS_CERT_FILE:-/run/secrets/mqtt/backend.crt}
      MQTT_TLS_KEY_FILE: ${MQTT_TLS_KEY_FILE:-/run/secrets/mqtt/backend.key}
      MQTT_TLS_SERVER_NAME: ${MQTT_TLS_SERVER_NAME:-}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
      DEVICE_PROVISION_MASTER_KEY: ${DEVICE_PROVISION_MASTER_KEY:-}
    volumes:
      - type: bind
        source: ${MQTT_BACKEND_CERT_DIR:-./secrets/backend}
        target: /run/secrets/mqtt
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "${BACKEND_PORT_BIND:-127.0.0.1:8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [local]

  web-dashboard:
    build:
      context: ../clients/web-dashboard
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    profiles: ["fullstack", "frontend"]
    environment:
      PORT: "3000"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT_BIND:-127.0.0.1:3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [local]

  # TLS-terminating reverse proxy for HTTPS & WSS on port 443.
  # Requires locally provisioned TLS certificates (server.crt, server.key) under PROXY_CERT_DIR.
  reverse-proxy:
    image: nginx:1.27-alpine
    profiles: ["reverse-proxy"]
    ports:
      - "${PROXY_HTTPS_BIND:-127.0.0.1:443}:443"
    volumes:
      - ./reverse-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - type: bind
        source: ${PROXY_CERT_DIR:-./secrets/proxy}
        target: /etc/nginx/certs
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
      web-dashboard:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -s /var/run/nginx.pid && nc -z 127.0.0.1 443 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [local]

volumes:
  pg_data:
  mqtt_data:

networks:
  local:
  # Keep the anonymous broker off the TLS/database network.
  dev:

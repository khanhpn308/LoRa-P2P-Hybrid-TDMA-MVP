# Local infrastructure. TLS/ACL sample requires human security review.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [local]

  # Unsafe for real Gateway connections. Local host-only development opt-in.
  mqtt-dev:
    image: eclipse-mosquitto:2.0
    user: "1883:1883"
    profiles: ["dev-insecure"]
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/dev.conf:/mosquitto/config/mosquitto.conf:ro
    networks: [dev]

  # TLS profile requires locally provisioned certificates (gitignored).
  mqtt-tls:
    build: ./mosquitto
    profiles: ["tls"]
    ports:
      - "127.0.0.1:8883:8883"
    volumes:
      - type: bind
        source: ${MQTT_CERT_DIR:-./secrets/broker}
        target: /mosquitto/certs
        read_only: true
        bind:
          create_host_path: false
      - mqtt_data:/mosquitto/data
    networks: [local]

volumes:
  pg_data:
  mqtt_data:

networks:
  local:
  # Keep the anonymous broker off the TLS/database network.
  dev:

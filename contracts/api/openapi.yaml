# OpenAPI 3.0.3 — PROPOSED, NOT IMPLEMENTED. Issue #15
openapi: "3.0.3"
info:
  title: "LoRa Hybrid TDMA MVP — Backend/Client REST Contract"
  version: "1.0.0-draft"
  description: "DRAFT v1 contract; 18 operations, including four VN920_V1 channel allocation endpoints (Issue #128, #154) and three additions from Issue #15. Periodic telemetry is deprecated (Event-Only V2). Bearer/JWT + browser WSS auth are D13 BLOCKED_SECURITY pending ADR. No client direct MQTT/DB; no physical actuation guarantee from HTTP 202."
servers:
  -
    url: "http://localhost:8080"
    description: "Loopback development only; deployment requires HTTPS"
security:
  -
    bearerAuth:
      []
tags:
  -
    name: "health"
  -
    name: "auth"
  -
    name: "gateways"
  -
    name: "nodes"
  -
    name: "alerts"
  -
    name: "schedules"
  -
    name: "audit"
  -
    name: "provisioning"
paths:
  "/healthz":
    get:
      operationId: "health_liveness"
      summary: "Process liveness (not Gateway/RF readiness)"
      tags:
        - "health"
      security:
        []
      responses:
        "200":
          description: "Process alive"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Health"
  "/api/v1/auth/login":
    post:
      operationId: "auth_login"
      summary: "PROVISIONAL username/password → short-lived bearer token"
      tags:
        - "auth"
      security:
        []
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "Successful operation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TokenResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/api/v1/gateways/{gw_id}/status":
    get:
      operationId: "gateways_status"
      summary: "Gateway last-known state; does not imply online now"
      tags:
        - "gateways"
      x-roles:
        - "ADMIN"
        - "OPERATOR"
        - "VIEWER"
      parameters:
        -
          "$ref": "#/components/parameters/GatewayId"
      responses:
        "200":
          description: "Successful operation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/GatewayStatus"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/api/v1/nodes":
    get:
      operationId: "nodes_list"
      summary: "Cursor-paginated nodes"
      tags:
        - "nodes"
      x-roles:
        - "ADMIN"
        - "OPERATOR"
        - "VIEWER"
      parameters:
        -
          "$ref": "#/components/parameters/Cursor"
        -
          "$ref": "#/components/parameters/Limit"
      responses:
        "200":
          description: "Successful operation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/NodePage"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/api/v1/nodes/{node_id}/telemetry":
    get:
      operationId: "nodes_telemetry"
      summary: "Cursor-paginated telemetry; UTC filter"
      deprecated: true
      description: "DEPRECATED_HISTORICAL: Historical periodic telemetry retrieval; superseded by Event-Only architecture (UP_EVENT 0x41). V2 nodes emit discrete event logs under /api/v1/alerts."
      tags:
        - "nodes"
      x-roles:
        - "ADMIN"
        - "OPERATOR"
        - "VIEWER"
      parameters:
        -
          "$ref": "#/components/parameters/NodeId"
        -
          "$ref": "#/components/parameters/Cursor"
        -
          "$ref": "#/components/parameters/Limit"
        -
          name: "from"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
        -
          name: "to"
          in: "query"
          required: false
          schema:
            type: "string"
            format: "date-time"
      responses:
        "200":
          description: "Successful operation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/TelemetryPage"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/api/v1/alerts":
    get:
      operationId: "alerts_list"
      summary: "Cursor-paginated alerts"
      tags:
        - "alerts"
      x-roles:
        - "ADMIN"
        - "OPERATOR"
        - "VIEWER"
      parameters:
        -
          "$ref": "#/components/parameters/Cursor"
        -
          "$ref": "#/components/parameters/Limit"
      responses:
        "200":
          description: "Successful operation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AlertPage"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/api/v1/alerts/{alert_id}/acknowledge":
    post:
      operationId: "alerts_acknowledge"
      summary: "Acknowledge alert in Backend; not an RF ACK"
      tags:
        - "alerts"
      x-roles:
        - "ADMIN"
        - "OPERATOR"
      parameters:
        -
          "$ref": "#/components/parameters/AlertId"
      responses:
        "200":
          description: "Successful operation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Alert"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/api/v1/gateways/{gw_id}/schedules/generate":
    post:
      operationId: "schedules_generate"
      description: "PROPOSED candidate profile; creation is not active. Clients must not infer schedule activation from HTTP 202."
      summary: "Generate/propose versioned TDMA schedule; NOT instantly ACTIVE"
      tags:
        - "schedules"
      x-roles:
        - "ADMIN"
      parameters:
        -
          "$ref": "#/components/parameters/GatewayId"
      responses:
        "202":
          description: "Successful operation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ScheduleSummary"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "503":
          "$ref": "#/components/responses/Unavailable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/GenerateScheduleRequest"
  "/api/v1/gateways/{gw_id}/schedules/{schedule_id}":
    get:
      operationId: "schedules_get"
      summary: "Read schedule lifecycle state; ACTIVE requires Gateway ACTIVE_REPORT"
      tags:
        - "schedules"
      x-roles:
        - "ADMIN"
        - "OPERATOR"
        - "VIEWER"
      parameters:
        -
          "$ref": "#/components/parameters/GatewayId"
        -
          "$ref": "#/components/parameters/ScheduleId"
      responses:
        "200":
          description: "Successful operation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ScheduleSummary"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/api/v1/nodes/{node_id}/commands":
    post:
      operationId: "nodes_command"
      description: "Requires stable X-Idempotency-Key on retries (DRAFT BREAKING CHANGE). Same authenticated actor/key and canonical request returns the original ticket; mismatched payload returns 409. HTTP 202 is acceptance, NOT radio execution."
      summary: "Queue downlink command with application expiry"
      tags:
        - "nodes"
      x-roles:
        - "ADMIN"
        - "OPERATOR"
      parameters:
        -
          "$ref": "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "202":
          description: "Successful operation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/CommandTicket"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
        "422":
          "$ref": "#/components/responses/Unprocessable"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/CommandRequest"
  "/api/v1/gateways/{gw_id}/schedules/{schedule_id}/review":
    post:
      operationId: "schedules_review"
      summary: "PROPOSED: human review for planned schedule; Gateway is not activated"
      description: "ADMIN reviews the proposed plan. APPROVE retains state PROPOSED with review_state APPROVED; REJECT sets REJECTED. This is not an RF activation and never sets ACTIVE."
      tags:
        - "schedules"
      x-roles: ["ADMIN"]
      parameters:
        - $ref: "#/components/parameters/GatewayId"
        - $ref: "#/components/parameters/ScheduleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleReviewRequest"
      responses:
        "200":
          description: "Updated review decision; schedule not activated"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  "/api/v1/gateways/{gw_id}/schedules/{schedule_id}/activation-requests":
    post:
      operationId: "schedules_request_activation"
      summary: "PROPOSED: queue an approved schedule for Gateway staging"
      description: "202 only means Backend accepted/persisted intent. Gateway may STAGE_ACK and later ACTIVE_REPORT; only correlated ACTIVE_REPORT yields ACTIVE. Repeated X-Idempotency-Key plus identical request returns same accepted operation; conflicting payload is 409."
      tags:
        - "schedules"
      x-roles: ["ADMIN"]
      parameters:
        - $ref: "#/components/parameters/GatewayId"
        - $ref: "#/components/parameters/ScheduleId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleActivationRequest"
      responses:
        "202":
          description: "Activation REQUEST accepted for asynchronous dispatch; NOT ACTIVE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleSummary"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/Unprocessable" }
        "503": { $ref: "#/components/responses/Unavailable" }
  "/api/v1/nodes/{node_id}/commands/{command_id}":
    get:
      operationId: "nodes_command_get"
      summary: "PROPOSED: read a persisted command ticket after HTTP 202"
      description: "Read-only status query. NODE_ACKED means node-level ACK as defined by Radio MAC; physical actuation confirmation is not implied."
      tags:
        - "nodes"
      x-roles: ["ADMIN", "OPERATOR", "VIEWER"]
      parameters:
        - $ref: "#/components/parameters/NodeId"
        - $ref: "#/components/parameters/CommandId"
      responses:
        "200":
          description: "Current persisted command state"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandTicket"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/Unprocessable" }
  "/api/v1/devices/provision":
    post:
      operationId: "devices_provision"
      summary: "Provision a new device with root K_JOIN key material"
      description: "Registers a device and persists wrapped K_JOIN under an initial active generation. Restricted to ADMIN."
      tags:
        - "nodes"
        - "provisioning"
      x-roles:
        - "ADMIN"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/DeviceProvisionRequest"
      responses:
        "201":
          description: "Device successfully provisioned"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/DeviceProvisionResponse"
        "400":
          description: "Invalid request payload or parameter format"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/Error"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/api/v1/audit":
    get:
      operationId: "audit_list"
      summary: "Read administrative audit log"
      tags:
        - "audit"
      x-roles:
        - "ADMIN"
      parameters:
        -
          "$ref": "#/components/parameters/Cursor"
        -
          "$ref": "#/components/parameters/Limit"
      responses:
        "200":
          description: "Successful operation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/AuditPage"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "422":
          "$ref": "#/components/responses/Unprocessable"
  "/api/v1/channels":
    get:
      operationId: "channels_list"
      summary: "List VN920 channels and availability"
      description: "Lists all VN920 channels (CH00..CH10) and their current allocation state. Assigned gateway identity is redacted for non-ADMIN users."
      tags:
        - "channels"
      x-roles:
        - "ADMIN"
        - "OPERATOR"
        - "VIEWER"
      responses:
        "200":
          description: "Channel catalog"
          content:
            "application/json":
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/ChannelInfo"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
  "/api/v1/gateways/{gw_id}/channels/request":
    post:
      operationId: "channels_request"
      summary: "Request exclusive VN920 channel allocation for a Gateway"
      description: "Requests exclusive assignment of one unallocated VN920 channel (CH00..CH10). Requires idempotency header. Fails with 409 if channel is already allocated or if gateway already holds a channel."
      tags:
        - "channels"
      x-roles:
        - "ADMIN"
        - "OPERATOR"
      parameters:
        -
          "$ref": "#/components/parameters/GatewayId"
        -
          "$ref": "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/ChannelRequest"
      responses:
        "201":
          description: "Channel allocated successfully"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ChannelAllocation"
        "422":
          "$ref": "#/components/responses/Unprocessable"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "409":
          "$ref": "#/components/responses/Conflict"
  "/api/v1/gateways/{gw_id}/channel":
    get:
      operationId: "channels_get_assignment"
      summary: "Get assigned VN920 channel for a Gateway"
      description: "Reads the currently allocated VN920 channel for the specified Gateway."
      tags:
        - "channels"
      x-roles:
        - "ADMIN"
        - "OPERATOR"
        - "VIEWER"
      parameters:
        -
          "$ref": "#/components/parameters/GatewayId"
      responses:
        "200":
          description: "Current channel allocation"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ChannelAllocation"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
    delete:
      operationId: "channels_release"
      summary: "Release assigned VN920 channel for a Gateway"
      description: "Releases the allocated channel for the Gateway. If the gateway has an ACTIVE TDMA schedule, release is rejected with 409 Conflict unless force=true is provided."
      tags:
        - "channels"
      x-roles:
        - "ADMIN"
      parameters:
        -
          "$ref": "#/components/parameters/GatewayId"
        -
          name: "force"
          in: "query"
          required: false
          schema:
            type: "boolean"
            default: false
      responses:
        "200":
          description: "Channel released successfully"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/ChannelReleaseResponse"
        "401":
          "$ref": "#/components/responses/Unauthorized"
        "403":
          "$ref": "#/components/responses/Forbidden"
        "404":
          "$ref": "#/components/responses/NotFound"
        "409":
          "$ref": "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
      description: "PROVISIONAL: bearer/JWT lifecycle requires security ADR. Never use in URL query."
  parameters:
    GatewayId:
      name: "gw_id"
      in: "path"
      required: true
      schema:
        type: "string"
        pattern: "^[A-Za-z0-9_-]{1,32}$"
    NodeId:
      name: "node_id"
      in: "path"
      required: true
      schema:
        type: "integer"
        minimum: 1
        maximum: 254
    AlertId:
      name: "alert_id"
      in: "path"
      required: true
      schema:
        type: "string"
        pattern: "^(0|[1-9][0-9]{0,19})$"
    ScheduleId:
      name: "schedule_id"
      in: "path"
      required: true
      schema:
        type: "string"
        pattern: "^(0|[1-9][0-9]{0,19})$"
    CommandId:
      name: "command_id"
      in: "path"
      required: true
      schema:
        type: "string"
        format: "uuid"
    IdempotencyKey:
      name: "X-Idempotency-Key"
      in: "header"
      required: true
      description: "Client-generated opaque key stable across HTTP retries. Scope is authenticated actor + operation + resource + canonical request fingerprint. Same key/different payload is 409; keys stored for at least the command/activation acceptance window (retention policy TBD). Never reuse for a different command."
      schema:
        type: "string"
        minLength: 16
        maxLength: 128
        pattern: "^[A-Za-z0-9_-]{16,128}$"
    Cursor:
      name: "cursor"
      in: "query"
      required: false
      schema:
        type: "string"
        minLength: 1
        maxLength: 512
    Limit:
      name: "limit"
      in: "query"
      required: false
      schema:
        type: "integer"
        minimum: 1
        maximum: 200
  schemas:
    Error:
      type: "object"
      additionalProperties: false
      required:
        - "code"
        - "message"
        - "request_id"
      properties:
        code:
          type: "string"
          minLength: 1
          maxLength: 64
        message:
          type: "string"
          minLength: 1
          maxLength: 512
        request_id:
          type: "string"
          minLength: 1
          maxLength: 128
        details:
          type: "object"
          additionalProperties: true
    Health:
      type: "object"
      additionalProperties: false
      required:
        - "status"
      properties:
        status:
          type: "string"
          enum:
            - "ok"
    LoginRequest:
      type: "object"
      additionalProperties: false
      required:
        - "username"
        - "password"
      properties:
        username:
          type: "string"
          minLength: 1
          maxLength: 64
        password:
          type: "string"
          minLength: 1
          maxLength: 512
    TokenResponse:
      type: "object"
      additionalProperties: false
      required:
        - "access_token"
        - "token_type"
        - "expires_in"
        - "role"
      properties:
        access_token:
          type: "string"
          minLength: 1
          maxLength: 4096
        token_type:
          type: "string"
          enum:
            - "Bearer"
        expires_in:
          type: "integer"
          minimum: 1
          maximum: 86400
        role:
          type: "string"
          enum:
            - "ADMIN"
            - "OPERATOR"
            - "VIEWER"
    GatewayStatus:
      type: "object"
      additionalProperties: false
      required:
        - "gateway_id"
        - "mode"
        - "active_schedule_version"
        - "last_seen_at"
        - "rf_duty_permille"
        - "node_count"
      properties:
        gateway_id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
        mode:
          type: "string"
          enum:
            - "BOOTSTRAP"
            - "ACTIVE"
            - "AUTONOMOUS"
            - "RECOVERY"
            - "FAULT"
            - "OFFLINE"
        active_schedule_version:
          type: "integer"
          minimum: 0
          maximum: 4294967295
        last_seen_at:
          type: "string"
          format: "date-time"
          nullable: true
        rf_duty_permille:
          type: "integer"
          minimum: 0
          maximum: 1000
        node_count:
          type: "integer"
          minimum: 0
          maximum: 254
    NodeSummary:
      type: "object"
      additionalProperties: false
      required:
        - "node_id"
        - "gateway_id"
        - "assigned_slot_id"
        - "last_seen_at"
        - "status"
      properties:
        node_id:
          type: "integer"
          minimum: 1
          maximum: 254
        gateway_id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
        name:
          type: "string"
          minLength: 1
          maxLength: 100
        assigned_slot_id:
          type: "integer"
          minimum: 1
          maximum: 15
          nullable: true
        last_seen_at:
          type: "string"
          format: "date-time"
          nullable: true
        last_rssi_dbm:
          type: "integer"
          minimum: -200
          maximum: 0
          nullable: true
        last_snr_db:
          type: "number"
          nullable: true
        battery_mv:
          type: "integer"
          minimum: 0
          maximum: 65535
          nullable: true
        status:
          type: "string"
          enum:
            - "ONLINE"
            - "OFFLINE"
            - "UNSYNCED"
            - "UNKNOWN"
    TelemetryReading:
      type: "object"
      additionalProperties: false
      required:
        - "reading_id"
        - "node_id"
        - "gateway_id"
        - "event_id"
        - "observed_at"
        - "received_at"
        - "buffered"
        - "superframe_seq"
        - "seq_num"
        - "data"
      properties:
        reading_id:
          type: "string"
          pattern: "^(0|[1-9][0-9]{0,19})$"
        node_id:
          type: "integer"
          minimum: 1
          maximum: 254
        gateway_id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
        event_id:
          type: "string"
          minLength: 1
          maxLength: 128
        observed_at:
          type: "string"
          format: "date-time"
          nullable: true
        received_at:
          type: "string"
          format: "date-time"
        buffered:
          type: "boolean"
        superframe_seq:
          type: "integer"
          minimum: 0
          maximum: 4294967295
        seq_num:
          type: "integer"
          minimum: 0
          maximum: 255
        data:
          type: "object"
          additionalProperties: false
          required:
            - "slot_id"
            - "sensor_status_mask"
            - "ch1_raw"
            - "ch2_raw"
            - "ch3_raw"
            - "battery_mv"
            - "node_duty_permille"
          properties:
            slot_id:
              type: "integer"
              minimum: 1
              maximum: 15
            sensor_status_mask:
              type: "integer"
              minimum: 0
              maximum: 255
            ch1_raw:
              type: "integer"
              minimum: -32768
              maximum: 32767
            ch2_raw:
              type: "integer"
              minimum: 0
              maximum: 65535
            ch3_raw:
              type: "integer"
              minimum: 0
              maximum: 65535
            battery_mv:
              type: "integer"
              minimum: 0
              maximum: 65535
            node_duty_permille:
              type: "integer"
              minimum: 0
              maximum: 1000
    Alert:
      type: "object"
      additionalProperties: false
      required:
        - "alert_id"
        - "node_id"
        - "gateway_id"
        - "event_ref"
        - "event_code"
        - "event_value"
        - "severity"
        - "triggered_at"
        - "received_at"
        - "ack_status"
        - "acked_at"
      properties:
        alert_id:
          type: "string"
          pattern: "^(0|[1-9][0-9]{0,19})$"
        node_id:
          type: "integer"
          minimum: 1
          maximum: 254
        gateway_id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
        event_ref:
          type: "integer"
          minimum: 0
          maximum: 4294967295
          description: "Monotonic local event reference (4B u32) from UP_EVENT 0x41"
        event_code:
          type: "integer"
          minimum: 0
          maximum: 255
          description: "Violation/alarm category code (1B u8, button press = 0x01)"
        event_value:
          type: "integer"
          minimum: -32768
          maximum: 32767
          description: "Sensor measurement reading at violation (2B i16, button press = 1)"
        severity:
          type: "string"
          enum:
            - "P0_EMERGENCY"
            - "P1_HIGH"
            - "P2_MEDIUM"
            - "P3_NORMAL"
        triggered_at:
          type: "string"
          format: "date-time"
          nullable: true
        received_at:
          type: "string"
          format: "date-time"
        ack_status:
          type: "string"
          enum:
            - "UNACKNOWLEDGED"
            - "ACKNOWLEDGED"
        acked_at:
          type: "string"
          format: "date-time"
          nullable: true
        trigger:
          type: "object"
          additionalProperties: false
          properties:
            channel:
              type: "integer"
              minimum: 1
              maximum: 3
            observed_raw:
              type: "integer"
              minimum: -2147483648
              maximum: 2147483647
            threshold_raw:
              type: "integer"
              minimum: -2147483648
              maximum: 2147483647
          required:
            - "channel"
            - "observed_raw"
            - "threshold_raw"
    ScheduleSummary:
      type: "object"
      additionalProperties: false
      required:
        - "schedule_id"
        - "gateway_id"
        - "version"
        - "state"
        - "activate_at_superframe_seq"
        - "created_at"
        - "activated_at"
      properties:
        schedule_id:
          type: "string"
          pattern: "^(0|[1-9][0-9]{0,19})$"
        gateway_id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
        version:
          type: "integer"
          minimum: 0
          maximum: 4294967295
        state:
          type: "string"
          enum:
            - "PROPOSED"
            - "SENT"
            - "STAGED"
            - "ACTIVE"
            - "REJECTED"
            - "EXPIRED"
        activate_at_superframe_seq:
          type: "integer"
          minimum: 0
          maximum: 4294967295
          nullable: true
        created_at:
          type: "string"
          format: "date-time"
        activated_at:
          type: "string"
          format: "date-time"
          nullable: true
        reject_reason:
          type: "string"
          maxLength: 2000
          nullable: true
        review_state:
          type: "string"
          enum: ["PENDING", "APPROVED", "REJECTED"]
          description: "PROPOSED extension: human review state independent of Gateway activation status; old clients may omit it. APPROVED does NOT mean ACTIVE."
    ScheduleReviewRequest:
      type: "object"
      additionalProperties: false
      required: ["decision"]
      properties:
        decision:
          type: "string"
          enum: ["APPROVE", "REJECT"]
        note:
          type: "string"
          minLength: 1
          maxLength: 2000
      description: "Human reviewer decision. No implicit RF activation."
    ScheduleActivationRequest:
      type: "object"
      additionalProperties: false
      required: ["expected_version"]
      properties:
        expected_version:
          type: "integer"
          minimum: 0
          maximum: 4294967295
      description: "Optimistic version check. Backend only accepts review_state APPROVED and a valid proposal; Gateway retains local activation authority."
    GenerateScheduleRequest:
      type: "object"
      additionalProperties: false
      required:
        - "profile_id"
      properties:
        profile_id:
          type: "string"
          enum:
            - "P-10S-15"
            - "V2-VN920-STATIC-15N"
        min_announce_superframes:
          type: "integer"
          minimum: 3
          maximum: 30
          description: "DEPRECATED_HISTORICAL: Legacy 3-2-1 countdown superframes parameter; superseded by V2 on-demand Maintenance schedule cutover (PR #206, #208)."
    CommandRequest:
      type: "object"
      additionalProperties: false
      required:
        - "action"
        - "params"
        - "expires_at"
      properties:
        action:
          type: "string"
          enum:
            - "SET_THRESHOLD"
            - "SET_SAMPLE_PERIOD"
            - "SET_RELAY"
        params:
          type: "object"
          additionalProperties:
            oneOf:
              -
                type: "integer"
              -
                type: "boolean"
          minProperties: 1
          maxProperties: 4
        expires_at:
          type: "string"
          format: "date-time"
    CommandTicket:
      type: "object"
      additionalProperties: false
      required:
        - "command_id"
        - "node_id"
        - "state"
        - "created_at"
      properties:
        command_id:
          type: "string"
          format: "uuid"
        node_id:
          type: "integer"
          minimum: 1
          maximum: 254
        state:
          type: "string"
          enum:
            - "QUEUED"
            - "DISPATCHED"
            - "NODE_ACKED"
            - "REJECTED"
            - "EXPIRED"
            - "UNKNOWN"
        created_at:
          type: "string"
          format: "date-time"
        state_revision:
          type: "string"
          pattern: "^(0|[1-9][0-9]{0,19})$"
          description: "Optional monotonically increasing persisted revision; correlate with WSS COMMAND_STATE_CHANGED and prevent stale UI regressions."
        reason_code:
          type: "string"
          minLength: 1
          maxLength: 64
          description: "Application reason; NODE_ACKED is not physical actuation proof."
    AuditEntry:
      type: "object"
      additionalProperties: false
      required:
        - "id"
        - "action"
        - "actor_id"
        - "target"
        - "occurred_at"
      properties:
        id:
          type: "string"
          pattern: "^(0|[1-9][0-9]{0,19})$"
        action:
          type: "string"
          minLength: 1
          maxLength: 64
        actor_id:
          type: "string"
          minLength: 1
          maxLength: 128
        target:
          type: "string"
          minLength: 1
          maxLength: 128
        occurred_at:
          type: "string"
          format: "date-time"
    NodePage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "next_cursor"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/NodeSummary"
        next_cursor:
          type: "string"
          minLength: 1
          maxLength: 512
          nullable: true
    TelemetryPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "next_cursor"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/TelemetryReading"
        next_cursor:
          type: "string"
          minLength: 1
          maxLength: 512
          nullable: true
    AlertPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "next_cursor"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/Alert"
        next_cursor:
          type: "string"
          minLength: 1
          maxLength: 512
          nullable: true
    AuditPage:
      type: "object"
      additionalProperties: false
      required:
        - "items"
        - "next_cursor"
      properties:
        items:
          type: "array"
          items:
            "$ref": "#/components/schemas/AuditEntry"
        next_cursor:
          type: "string"
          minLength: 1
          maxLength: 512
          nullable: true
    ChannelInfo:
      type: "object"
      additionalProperties: false
      required:
        - "channel_id"
        - "frequency_hz"
        - "bandwidth_hz"
        - "status"
      properties:
        channel_id:
          type: "string"
          pattern: "^CH(0[0-9]|10)$"
        frequency_hz:
          type: "integer"
          minimum: 920250000
          maximum: 922750000
        bandwidth_hz:
          type: "integer"
          enum: [125000]
        status:
          type: "string"
          enum:
            - "AVAILABLE"
            - "ALLOCATED"
        assigned_gateway_id:
          type: "string"
          nullable: true
          pattern: "^[A-Za-z0-9_-]{1,32}$"
    ChannelRequest:
      type: "object"
      additionalProperties: false
      required:
        - "channel_id"
      properties:
        channel_id:
          type: "string"
          pattern: "^CH(0[0-9]|10)$"
    ChannelAllocation:
      type: "object"
      additionalProperties: false
      required:
        - "gateway_id"
        - "channel_id"
        - "frequency_hz"
        - "bandwidth_hz"
        - "allocation_generation"
        - "allocated_at"
        - "rf_authorized"
        - "state"
      properties:
        gateway_id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
        channel_id:
          type: "string"
          pattern: "^CH(0[0-9]|10)$"
        frequency_hz:
          type: "integer"
          minimum: 920250000
          maximum: 922750000
        bandwidth_hz:
          type: "integer"
          enum: [125000]
        allocation_generation:
          type: "integer"
          minimum: 1
          maximum: 4294967295
        allocated_at:
          type: "string"
          format: "date-time"
          pattern: "Z$"
        rf_authorized:
          type: "boolean"
          description: "False upon channel allocation; RF authorization requires valid active schedule, clock confidence and duty cycle limit."
        state:
          type: "string"
          enum:
            - "ALLOCATED"
            - "RELEASED"
    ChannelReleaseResponse:
      type: "object"
      additionalProperties: false
      required:
        - "gateway_id"
        - "channel_id"
        - "released_at"
        - "status"
      properties:
        gateway_id:
          type: "string"
          pattern: "^[A-Za-z0-9_-]{1,32}$"
        channel_id:
          type: "string"
          pattern: "^CH(0[0-9]|10)$"
        released_at:
          type: "string"
          format: "date-time"
          pattern: "Z$"
        status:
          type: "string"
          enum:
            - "RELEASED"
    DeviceProvisionRequest:
      type: "object"
      required:
        - "network_id"
        - "device_mac"
        - "k_join"
      properties:
        network_id:
          type: "integer"
          format: "int64"
          minimum: 1
          description: "Network identifier"
          example: 1
        device_mac:
          type: "string"
          pattern: "^[0-9a-f]{12}$"
          description: "12 hex characters lowercase MAC address"
          example: "001122334455"
        k_join:
          type: "string"
          pattern: "^(?:[0-9a-fA-F]{64}|[A-Za-z0-9+/]{43}=?)$"
          description: "256-bit CSPRNG key in 64 hex characters or 32-byte Base64"
        generation:
          type: "integer"
          minimum: 1
          maximum: 65535
          default: 1
          description: "Key generation counter"
          example: 1
        initial_join_counter:
          type: "integer"
          minimum: 0
          maximum: 4294967295
          default: 0
          description: "Initial monotonic join counter"
          example: 0
    DeviceProvisionResponse:
      type: "object"
      required:
        - "device_mac"
        - "network_id"
        - "generation"
        - "status"
        - "created_at"
      properties:
        device_mac:
          type: "string"
          pattern: "^[0-9a-f]{12}$"
          example: "001122334455"
        network_id:
          type: "integer"
          format: "int64"
          example: 1
        generation:
          type: "integer"
          example: 1
        status:
          type: "string"
          enum:
            - "ACTIVE"
          example: "ACTIVE"
        created_at:
          type: "string"
          format: "date-time"
          example: "2026-11-08T00:00:00Z"
  responses:
    Unauthorized:
      description: "Authentication required"
      headers:
        WWW-Authenticate:
          description: 'RFC 6750 Bearer challenge (realm; invalid_token when applicable).'
          required: true
          schema:
            type: "string"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Forbidden:
      description: "Role forbidden"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    NotFound:
      description: "Resource not found"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Conflict:
      description: "State conflict or stale version"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Unprocessable:
      description: "Validation error"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"
    Unavailable:
      description: "Upstream unavailable"
      content:
        "application/json":
          schema:
            "$ref": "#/components/schemas/Error"

name: CI - Firmware Agent Harness (host gates only)

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - ".agent-harness/**"
      - ".agents/**"
      - "scripts/agent_harness/**"
      - "tests/agent_harness/**"
      - "docs/development/agent-harness-firmware.md"
      - "docs/development/c-clean-code-refactoring-standard.md"
      - "docs/development/ccars-graph-first-adoption.md"
      - "docs/development/harness-quality-gates.md"
      - ".github/workflows/ci-agent-harness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compile Python harness
        run: python3 -m compileall -q scripts/agent_harness tests/agent_harness
      - name: Validate AGY JSON Schema
        run: python3 -m json.tool scripts/agent_harness/adapters/audit.schema.json > /dev/null
      - name: Scope guard tests
        run: python3 -m unittest discover -s tests/agent_harness -v
      - name: Repo structure guard
        run: python3 scripts/verify_structure.py

name: CI - Firmware Scaffolds
# Do not build ESP-IDF for unrelated Web, Backend, or documentation PRs.
# If these jobs are required checks for every PR, path-based skipping can leave
# checks Pending. Configure branch rules accordingly before enforcing them.
on:
  pull_request:
    paths:
      - "firmware/**"
      - "contracts/radio-mac/**"
      - "contracts/mqtt/**"
      - ".github/workflows/ci-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-build:
    name: gateway-esp32-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ESP-IDF Gateway scaffold build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: "release-v5.4"
          target: esp32
          path: firmware/gateway_master
  node-build:
    name: node-esp32-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ESP-IDF Node scaffold build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: "release-v5.4"
          target: esp32
          path: firmware/sensor_node

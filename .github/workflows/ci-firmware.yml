name: CI - Firmware Scaffolds
# Do not build ESP-IDF for unrelated Web, Backend, or documentation PRs.
# If these jobs are required checks for every PR, path-based skipping can leave
# checks Pending. Configure branch rules accordingly before enforcing them.
on:
  pull_request:
    paths:
      - "firmware/**"
      - "contracts/radio-mac/**"
      - "contracts/mqtt/**"
      - ".github/workflows/ci-firmware.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway-build:
    name: gateway-esp32-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve project-pinned ESP-IDF release
        id: idf
        shell: bash
        run: |
          version="$(tr -d '\r\n' < firmware/esp-idf-version.txt)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid ESP-IDF release: $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: ESP-IDF Gateway scaffold build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32
          path: firmware/gateway_master
          command: idf.py --version && idf.py build
  node-build:
    name: node-esp32-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Resolve project-pinned ESP-IDF release
        id: idf
        shell: bash
        run: |
          version="$(tr -d '\r\n' < firmware/esp-idf-version.txt)"
          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "Invalid ESP-IDF release: $version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: ESP-IDF Node scaffold build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ steps.idf.outputs.version }}
          target: esp32
          path: firmware/sensor_node
          command: idf.py --version && idf.py build

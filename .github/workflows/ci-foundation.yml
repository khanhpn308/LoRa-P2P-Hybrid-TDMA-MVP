name: CI - Foundation
on:
  push:
    branches: [main, "chore/**", "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    name: scaffold-contracts-structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python3 scripts/verify_structure.py
      - run: python3 -m compileall -q scripts
      - name: Validate JSON schemas
        run: |
          python3 -m json.tool contracts/mqtt/schemas/telemetry.schema.json >/dev/null

name: Embedded firmware task
description: ESP-IDF C / SX1276 / Gateway / Node development
title: "[FW] "
labels: ["type:feature"]
body:
  - type: textarea
    id: target_directories
    attributes:
      label: "Target Directories (allowed paths)"
      description: "REQUIRED. List every repository-relative directory or specific file this Issue permits changing. Cross-path changes need Issue scope update and reviewer approval."
      placeholder: |
        firmware/components/sx1276_driver/
        tests/hil/
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Target component
      options:
        - Gateway / TDMA Master
        - Sensor Node
        - Shared SX1276 Driver
        - Shared MAC / Air Time
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Requirement and problem
      description: Link requirement ID and relevant contract/ADR.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Given ... when ... then ..."
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Verification plan
      placeholder: "Build, test fixture, UART/SPI log, HIL timing evidence, RF limits"
    validations:
      required: true

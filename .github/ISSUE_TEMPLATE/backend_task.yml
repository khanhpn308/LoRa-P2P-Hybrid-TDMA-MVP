name: Backend task
description: Go, MQTT, PostgreSQL, schedule planning or API
title: "[GO] "
labels: ["type:feature", "layer:backend-go"]
body:
  - type: textarea
    id: target_directories
    attributes:
      label: "Target Directories (allowed paths)"
      description: "REQUIRED. List every repository-relative directory or specific file this Issue permits changing. Cross-path changes need Issue scope update and reviewer approval."
      placeholder: |
        firmware/components/sx1276_driver/
        tests/hil/
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Requirement / contract reference
      description: Reference MQTT schema / OpenAPI / DB migration when relevant.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] Unit and integration test conditions"
    validations:
      required: true
  - type: textarea
    id: failure
    attributes:
      label: Idempotency, security and failure modes
      placeholder: "Retry, duplicate, timeout, rollback, authentication"
    validations:
      required: true

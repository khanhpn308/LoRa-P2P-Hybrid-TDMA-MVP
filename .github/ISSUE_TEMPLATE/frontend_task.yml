name: Client task
description: React/TypeScript UI or Flutter mobile client
title: "[CLIENT] "
labels: ["type:feature"]
body:
  - type: textarea
    id: target_directories
    attributes:
      label: "Target Directories (allowed paths)"
      description: "REQUIRED. List every repository-relative directory or specific file this Issue permits changing. Cross-path changes need Issue scope update and reviewer approval."
      placeholder: |
        firmware/components/sx1276_driver/
        tests/hil/
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: Client
      options:
        - Web Dashboard
        - Mobile App
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: UX and API contract requirement
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria and tests
    validations:
      required: true

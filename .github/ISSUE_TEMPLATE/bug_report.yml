name: Bug report
description: Reproducible firmware, RF, backend or UI defect
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: target_directories
    attributes:
      label: "Target Directories (allowed paths)"
      description: "REQUIRED. List every repository-relative directory or specific file this Issue permits changing. Cross-path changes need Issue scope update and reviewer approval."
      placeholder: |
        firmware/components/sx1276_driver/
        tests/hil/
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual behavior and reproducible steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, version, hardware and test conditions
      description: Redact all passwords, access tokens and device credentials.
    validations:
      required: true

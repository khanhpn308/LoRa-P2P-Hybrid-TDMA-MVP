name: Bug report
description: Reproducible firmware, RF, backend or UI defect
title: "[BUG] "
labels: ["type:bug"]
body:
  - type: textarea
    id: observed
    attributes:
      label: Actual behavior and reproducible steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Logs, version, hardware and test conditions
      description: Redact all passwords, access tokens and device credentials.
    validations:
      required: true
